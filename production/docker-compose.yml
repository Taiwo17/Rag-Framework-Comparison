services:
  rag-api:
    build:
      context: ..
      dockerfile: production/Dockerfile

    expose:
      - '8000'

    env_file:
      - .env

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      VECTOR_STORE_PATH: /app/evaluation/vector_stores/langchain
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    volumes:
      - ../evaluation/vector_stores/langchain:/app/evaluation/vector_stores/langchain:ro
      - ./api:/app/production/api:ro

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    # Container resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G

    # Container security hardening
    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  nginx:
    image: nginx:alpine
    container_name: springer-rag-nginx
    ports:
      - '8080:80'
      - '8443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      rag-api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  redis:
    image: redis:7-alpine
    container_name: springer-rag-redis
    expose:
      - '6379'
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
